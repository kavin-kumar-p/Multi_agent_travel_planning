[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-travel-planning"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Orchestration frameworks
    "google-adk>=1.0.0",
    "langgraph>=0.2.0",
    "crewai>=0.80.0",

    # LangChain core + providers
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",

    # Vector DB
    "faiss-cpu>=1.8.0",
    "langchain-text-splitters>=0.3.0",

    # A2A protocol (official SDK — protobuf-based v1.1+)
    "a2a-sdk>=1.1.2",

    # MCP (Model Context Protocol)
    "mcp>=1.0.0",

    # Config & env
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",

    # Prompt loading
    "pyyaml>=6.0",

    # Async HTTP (used by MCP server)
    "httpx>=0.27.0",

    # SQLAlchemy async support (required by ADK DatabaseSessionService)
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",

    # Streamlit frontend
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
